<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <style>.af{fill:var(--accent,currentColor)}.as{stroke:var(--accent,currentColor)}</style>
  <!-- Spieler: Piktogramm-Silhouette in Spielhaltung mit Stock -->
  <circle cx="50" cy="19" r="11" fill="currentColor"/>
  <!-- Rumpf -->
  <path fill="currentColor" stroke="currentColor" stroke-width="9" stroke-linejoin="round"
        d="M48,36 L66,33 L72,58 L54,62 Z"/>
  <!-- Beine -->
  <g fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58,60 L44,76 L34,91"/>
    <path d="M68,58 L82,72 L84,91"/>
  </g>
  <!-- Arme zum Stock -->
  <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64,40 L86,50"/>
    <path d="M56,48 L80,62"/>
  </g>
  <!-- Stock (Akzent) -->
  <g class="as" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88,42 L104,84" stroke-width="8"/>
    <path d="M104,84 L124,77" stroke-width="10"/>
  </g>
</svg>
