name: TCConsole — Windows-App (ZIP)

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'RedAnts-TCConsole/**'
      - '.github/workflows/tcconsole-app-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: RedAnts-TCConsole
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp version
        id: version
        run: |
          $csproj = [xml](Get-Content TcuConsole.csproj)
          $base = ($csproj.Project.PropertyGroup | Where-Object { $_.Version }).Version
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish TcuConsole.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o package

      - name: Assemble package
        run: |
          "${{ steps.version.outputs.version }}" | Set-Content package/release.txt -Encoding utf8
          Copy-Item Update-TcuConsole.ps1 package/
          Compress-Archive -Path package/* -DestinationPath "tcconsole-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tcconsole-${{ steps.version.outputs.version }}
          path: RedAnts-TCConsole/tcconsole-*.zip

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: tcconsole-v${{ steps.version.outputs.version }}
          name: RedAnts TCConsole ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          generate_release_notes: true
          files: RedAnts-TCConsole/tcconsole-*.zip
