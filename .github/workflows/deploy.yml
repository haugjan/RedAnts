name: Deploy to Azure

# Two-stage deploy (both App Services in Switzerland North), Microsoft Entra / OIDC — no basic
# auth and no long-lived publish password.
#
#   push to feature/**  -> deploy DEV
#   push to main        -> deploy DEV, then PROD
#
# GitHub Environments 'dev' and 'prod' each carry the federated-credential subject
# (repo:haugjan/RedAnts:environment:<env>) and the per-stage variable AZURE_WEBAPP_NAME
# (app-redants-dev / app-redants-prod). Repo secrets (same app registration for both):
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  id-token: write   # required for the runner to request an OIDC token
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore RedAnts.slnx
      - run: dotnet build RedAnts.slnx --configuration Release --no-restore
      - run: dotnet test RedAnts.slnx --configuration Release --no-build
      - run: dotnet publish src/RedAnts.Host/RedAnts.Host.csproj --configuration Release --output ./publish --no-build
      - name: Strip PdfSharp companion DLLs from deps.json
        run: |
          jq '
            .targets |= map_values(
              map_values(
                if has("runtime") then
                  .runtime |= with_entries(
                    select(.key | test("PdfSharp\\.(BarCodes|Charting|Quality|Snippets|WPFonts)\\.dll$") | not)
                  )
                else . end
              )
            )
          ' ./publish/RedAnts.deps.json > /tmp/deps.tmp \
            && mv /tmp/deps.tmp ./publish/RedAnts.deps.json
          echo "PdfSharp companions stripped from deps.json"
      - name: Package
        run: cd ./publish && zip -r ../app.zip . && cd ..
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
          retention-days: 3

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    # Serialize all writes to the DEV app across branches (feature/** and main both deploy here).
    # Queue instead of cancel: never interrupt an in-flight `az webapp deploy`, which could leave
    # the App Service with a half-extracted zip. A newer run waits; a still-pending run is replaced.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup .NET (for migrations)
        if: vars.SQL_DSN != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Run database migrations (deploy identity holds DDL, the web app does not)
        if: vars.SQL_DSN != ''
        env:
          ConnectionStrings__umbracoDbDSN: ${{ vars.SQL_DSN }}
          ConnectionStrings__umbracoDbDSN_ProviderName: Microsoft.Data.SqlClient
          ASPNETCORE_ENVIRONMENT: Development
          Azure__KeyVaultUri: ''
          Umbraco__CMS__Runtime__Mode: BackofficeDevelopment
          Migrations__RunAtBoot: 'true'
        run: |
          mkdir -p migrate && unzip -q app.zip -d migrate
          cd migrate && dotnet RedAnts.dll --migrate
      - name: Deploy (az webapp deploy over ARM)
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy --resource-group RG_RedAnts --name "$WEBAPP" \
            --src-path app.zip --type zip --track-status false --restart false --timeout 600000
      - name: Configure app settings (dev — single write, one restart)
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
          PAYREXX_TEST_API_SECRET: ${{ secrets.PAYREXX_TEST_API_SECRET }}
          IMAGING_HMAC_KEY: ${{ secrets.IMAGING_HMAC_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          APP_DSN: ${{ vars.APP_DSN }}
          MEDIA_ACCOUNT_URL: ${{ vars.MEDIA_ACCOUNT_URL }}
          SHOW_ACCOUNT_URL: ${{ vars.SHOW_ACCOUNT_URL }}
        run: |
          SETTINGS=(Umbraco__CMS__Runtime__Mode=BackofficeDevelopment Orders__NumberPrefix=DEV-)
          if [ -n "$PAYREXX_TEST_API_SECRET" ]; then
            SETTINGS+=(Payrexx__Instance=redants-test "Payrexx__ApiSecret=$PAYREXX_TEST_API_SECRET")
          else
            echo "Payrexx test secret not set; leaving Payrexx config unchanged."
          fi
          if [ -n "$IMAGING_HMAC_KEY" ]; then
            SETTINGS+=("Umbraco__CMS__Imaging__HMACSecretKey=$IMAGING_HMAC_KEY")
          else
            echo "Imaging HMAC secret not set; leaving unchanged."
          fi
          if [ -n "$APP_DSN" ]; then
            SETTINGS+=("ConnectionStrings__umbracoDbDSN=$APP_DSN" "ConnectionStrings__umbracoDbDSN_ProviderName=Microsoft.Data.SqlClient")
          fi
          if [ -n "$MEDIA_ACCOUNT_URL" ]; then
            SETTINGS+=("Umbraco__Storage__AzureBlob__Media__AccountUrl=$MEDIA_ACCOUNT_URL")
          fi
          if [ -n "$SHOW_ACCOUNT_URL" ]; then
            SETTINGS+=("Show__Storage__AccountUrl=$SHOW_ACCOUNT_URL")
          fi
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            SETTINGS+=("Smtp__User=$SMTP_USER" "Smtp__Password=$SMTP_PASSWORD")
          else
            echo "SMTP secrets not set; leaving unchanged."
          fi
          az webapp config appsettings set --resource-group RG_RedAnts --name "$WEBAPP" \
            --settings "${SETTINGS[@]}" --output none
          echo "Applied ${#SETTINGS[@]} app settings to $WEBAPP in a single write (one restart)."
      - name: Warm up the site
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          BASE="https://$WEBAPP.azurewebsites.net"
          # Deploy runs with --restart false so the old worker keeps serving during the zip upload.
          # The appsettings write above is the ONLY restart trigger: new code + new settings land
          # together in a single cold start. Wait for that restart to tear down the old worker,
          # then poll /health until the new worker answers before warming views.
          # /health returns 200 immediately once ASP.NET is listening; no site-gate auth needed.
          # Best-effort: never fail here.
          echo "Waiting for the app-settings restart to take the old worker down..."
          sleep 30
          wait_up() {
            for i in $(seq 1 30); do
              S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$BASE/health") || S="000"
              echo "Attempt $i: GET /health -> $S"
              case "$S" in 200) return 0 ;; esac
              sleep 10
            done
            return 1
          }
          if ! wait_up; then
            echo "App did not respond within the warm-up window (best-effort)."; exit 0
          fi
          echo "Up. Warming core pages via /warmup..."
          OUT=$(curl -s --max-time 120 "$BASE/warmup") || OUT=""
          echo "$OUT"
          # A freshly swapped worker occasionally boots into a broken state after the zip
          # deploy (500s on runtime-compiled pages until the next restart). One clean
          # restart heals it, so detect 500s in the warm-up output and restart once.
          if [ -z "$OUT" ] || echo "$OUT" | grep -q ' -> 500'; then
            echo "Warm-up saw errors; restarting once and re-warming..."
            az webapp restart --resource-group RG_RedAnts --name "$WEBAPP" || true
            sleep 30
            if wait_up; then
              curl -s --max-time 120 "$BASE/warmup" || true
            fi
          fi
          exit 0

  deploy-prod:
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    # Same queueing as dev: only one PROD deploy writes at a time, and it is never cancelled mid-write.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup .NET (for migrations)
        if: vars.SQL_DSN != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Run database migrations (deploy identity holds DDL, the web app does not)
        if: vars.SQL_DSN != ''
        env:
          ConnectionStrings__umbracoDbDSN: ${{ vars.SQL_DSN }}
          ConnectionStrings__umbracoDbDSN_ProviderName: Microsoft.Data.SqlClient
          ASPNETCORE_ENVIRONMENT: Development
          Azure__KeyVaultUri: ''
          Umbraco__CMS__Runtime__Mode: BackofficeDevelopment
          Migrations__RunAtBoot: 'true'
        run: |
          mkdir -p migrate && unzip -q app.zip -d migrate
          cd migrate && dotnet RedAnts.dll --migrate
      - name: Deploy (az webapp deploy over ARM)
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy --resource-group RG_RedAnts --name "$WEBAPP" \
            --src-path app.zip --type zip --track-status false --restart false --timeout 600000
      - name: Configure app settings (prod — single write, one restart)
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
          PAYREXX_API_SECRET: ${{ secrets.PAYREXX_API_SECRET }}
          IMAGING_HMAC_KEY: ${{ secrets.IMAGING_HMAC_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          APP_DSN: ${{ vars.APP_DSN }}
          MEDIA_ACCOUNT_URL: ${{ vars.MEDIA_ACCOUNT_URL }}
          SHOW_ACCOUNT_URL: ${{ vars.SHOW_ACCOUNT_URL }}
        run: |
          SETTINGS=(Umbraco__CMS__Runtime__Mode=BackofficeDevelopment)
          if [ -n "$PAYREXX_API_SECRET" ]; then
            SETTINGS+=(Payrexx__Instance=redants "Payrexx__ApiSecret=$PAYREXX_API_SECRET")
          else
            echo "Payrexx secret not set for prod; leaving Payrexx config unchanged."
          fi
          if [ -n "$IMAGING_HMAC_KEY" ]; then
            SETTINGS+=("Umbraco__CMS__Imaging__HMACSecretKey=$IMAGING_HMAC_KEY")
          else
            echo "Imaging HMAC secret not set; leaving unchanged."
          fi
          if [ -n "$APP_DSN" ]; then
            SETTINGS+=("ConnectionStrings__umbracoDbDSN=$APP_DSN" "ConnectionStrings__umbracoDbDSN_ProviderName=Microsoft.Data.SqlClient")
          fi
          if [ -n "$MEDIA_ACCOUNT_URL" ]; then
            SETTINGS+=("Umbraco__Storage__AzureBlob__Media__AccountUrl=$MEDIA_ACCOUNT_URL")
          fi
          if [ -n "$SHOW_ACCOUNT_URL" ]; then
            SETTINGS+=("Show__Storage__AccountUrl=$SHOW_ACCOUNT_URL")
          fi
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            SETTINGS+=("Smtp__User=$SMTP_USER" "Smtp__Password=$SMTP_PASSWORD")
          else
            echo "SMTP secrets not set; leaving unchanged."
          fi
          az webapp config appsettings set --resource-group RG_RedAnts --name "$WEBAPP" \
            --settings "${SETTINGS[@]}" --output none
          echo "Applied ${#SETTINGS[@]} app settings to $WEBAPP in a single write (one restart)."
      - name: Warm up the site
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          BASE="https://$WEBAPP.azurewebsites.net"
          # Deploy runs with --restart false (see deploy-dev): appsettings write is the sole restart,
          # new code + new settings land together. /health returns 200 once ASP.NET is listening.
          echo "Waiting for the app-settings restart to take the old worker down..."
          sleep 30
          wait_up() {
            for i in $(seq 1 30); do
              S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$BASE/health") || S="000"
              echo "Attempt $i: GET /health -> $S"
              case "$S" in 200) return 0 ;; esac
              sleep 10
            done
            return 1
          }
          if ! wait_up; then
            echo "App did not respond within the warm-up window (best-effort)."; exit 0
          fi
          echo "Up. Warming core pages via /warmup..."
          OUT=$(curl -s --max-time 120 "$BASE/warmup") || OUT=""
          echo "$OUT"
          # A freshly swapped worker occasionally boots into a broken state after the zip
          # deploy (500s on runtime-compiled pages until the next restart). One clean
          # restart heals it, so detect 500s in the warm-up output and restart once.
          if [ -z "$OUT" ] || echo "$OUT" | grep -q ' -> 500'; then
            echo "Warm-up saw errors; restarting once and re-warming..."
            az webapp restart --resource-group RG_RedAnts --name "$WEBAPP" || true
            sleep 30
            if wait_up; then
              curl -s --max-time 120 "$BASE/warmup" || echo "(re-warmup failed, best-effort)"
            fi
          fi
          exit 0
