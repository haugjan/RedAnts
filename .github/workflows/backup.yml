name: Weekly Backup Check

# Backups are taken by Azure SQL itself (point-in-time restore for 14 days, long-term retention weekly,
# monthly and yearly). This job keeps those policies and the blob protection in place (idempotent) and
# reports what can currently be restored. It needs no SQL login and no storage key: the server is
# Entra-only and the storage accounts have shared-key access disabled.

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays 02:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'haugjan'
    environment: prod
    env:
      RESOURCE_GROUP: RG_RedAnts
      SQL_SERVER: sql-redants-ch
      SQL_DATABASE: sqldb-redants-prod
      STORAGE_ACCOUNT: stredantsprod
      LOCATION: switzerlandnorth
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure blob protection (soft delete 14 d + container soft delete 14 d + versioning + change feed, idempotent)
        run: |
          az storage account blob-service-properties update \
            --account-name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --enable-delete-retention true \
            --delete-retention-days 14 \
            --enable-container-delete-retention true \
            --container-delete-retention-days 14 \
            --enable-versioning true \
            --enable-change-feed true \
            --output none
          echo "Blob protection on $STORAGE_ACCOUNT is in place."

      - name: Ensure SQL backup retention (point-in-time 14 d, long-term weekly 8 w / monthly 12 m / yearly 5 y, idempotent)
        run: |
          az sql db str-policy set \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$SQL_DATABASE" \
            --retention-days 14 --output none
          az sql db ltr-policy set \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$SQL_DATABASE" \
            --weekly-retention P8W --monthly-retention P12M --yearly-retention P5Y --week-of-year 1 --output none
          echo "Retention policies on $SQL_DATABASE are in place."

      - name: Report restorable backups
        run: |
          echo "Earliest point-in-time restore for $SQL_DATABASE:"
          az sql db show --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$SQL_DATABASE" \
            --query "earliestRestoreDate" -o tsv
          echo "Long-term retention backups:"
          az sql db ltr-backup list --location "$LOCATION" --server "$SQL_SERVER" --database "$SQL_DATABASE" \
            --query "[].{name:name,taken:properties.backupTime,expires:properties.backupExpirationTime}" -o table
