name: Weekly Backup

# Exports the prod database to a BACPAC in the sql-backups blob container.
#
# Auth: OIDC (azure/login) as the redants-github-deploy app registration. The SQL
# admin credentials are read at runtime from Key Vault (no DB password in GitHub).
#
# Requires (granted once, on the RedAnts subscription fdf0cdfa-...):
#   - Service principal ea133dd3-...:
#       * "Storage Account Contributor" on storage account stredantsprod
#       * "SQL DB Contributor" on SQL server sql-redants-ch
#       * Key Vault access policy get/list secrets on kv-redants-prod
#   - Key Vault kv-redants-prod secrets: backup-sql-prod-user, backup-sql-prod-password
#     (contained DB user redants_backup on sqldb-redants-prod with db_datareader + VIEW DEFINITION)
#
# Manual runs (workflow_dispatch) are restricted to the repo owner; the schedule
# always runs.

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays 02:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'haugjan'
    environment: prod
    env:
      RESOURCE_GROUP: RG_RedAnts
      SQL_SERVER: sql-redants-ch
      SQL_DATABASE: sqldb-redants-prod
      STORAGE_ACCOUNT: stredantsprod
      BACKUP_CONTAINER: sql-backups
      KEY_VAULT: kv-redants-prod

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure blob protection (soft delete 14 d + container soft delete 14 d + versioning + change feed, idempotent)
        run: |
          az storage account blob-service-properties update \
            --account-name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --enable-delete-retention true \
            --delete-retention-days 14 \
            --enable-container-delete-retention true \
            --container-delete-retention-days 14 \
            --enable-versioning true \
            --enable-change-feed true

      - name: Retrieve storage key
        run: |
          KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          echo "STORAGE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Fetch SQL credentials from Key Vault
        run: |
          BACKUP_USER=$(az keyvault secret show --vault-name "$KEY_VAULT" --name backup-sql-prod-user --query value -o tsv)
          BACKUP_PASSWORD=$(az keyvault secret show --vault-name "$KEY_VAULT" --name backup-sql-prod-password --query value -o tsv)
          echo "::add-mask::$BACKUP_PASSWORD"
          echo "SQL_ADMIN_USER=$BACKUP_USER" >> "$GITHUB_ENV"
          echo "SQL_ADMIN_PASSWORD=$BACKUP_PASSWORD" >> "$GITHUB_ENV"

      - name: Ensure sql-backups container exists
        run: |
          az storage container create \
            --name "$BACKUP_CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY"

      - name: Export SQL database as BACPAC
        run: |
          BACKUP_DATE=$(date -u +%Y-%m-%d)
          BACPAC_URI="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${BACKUP_CONTAINER}/redants-${BACKUP_DATE}.bacpac"
          echo "Exporting to $BACPAC_URI ..."
          az sql db export \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER" \
            --name "$SQL_DATABASE" \
            --admin-user "$SQL_ADMIN_USER" \
            --admin-password "$SQL_ADMIN_PASSWORD" \
            --storage-key-type StorageAccessKey \
            --storage-key "$STORAGE_KEY" \
            --storage-uri "$BACPAC_URI"
          echo "Export done: redants-${BACKUP_DATE}.bacpac"

      - name: Delete BACPAC files older than 90 days
        run: |
          CUTOFF=$(date -u -d "-90 days" +%Y-%m-%dT%H:%M:%SZ)
          az storage blob list \
            --container-name "$BACKUP_CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --query "[?properties.lastModified < '${CUTOFF}'].name" \
            -o tsv | \
          while IFS= read -r blob; do
            [ -z "$blob" ] && continue
            echo "Deleting: $blob"
            az storage blob delete \
              --container-name "$BACKUP_CONTAINER" \
              --name "$blob" \
              --account-name "$STORAGE_ACCOUNT" \
              --account-key "$STORAGE_KEY"
          done
