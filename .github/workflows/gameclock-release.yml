name: GameClock — Matchuhr-Webapp

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'RedAnts-GameClock/**'
      - '.github/workflows/gameclock-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RedAnts-GameClock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp version
        id: version
        run: |
          BASE=$(grep -oP '(?<=<Version>)[^<]+' RedAnts.GameClock.csproj)
          VERSION="$(echo "$BASE" | cut -d. -f1-2).$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PACKAGE="$RUNNER_TEMP/package"
          for RID in win-x64 linux-x64 linux-arm64; do
            dotnet publish RedAnts.GameClock.csproj -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none \
              -p:Version="$VERSION" -o "$PACKAGE/$RID"
            echo "$VERSION" > "$PACKAGE/$RID/release.txt"
          done
          cp Start-GameClock.ps1 Start-GameClock.cmd "$PACKAGE/win-x64/"
          cp start-gameclock.sh "$PACKAGE/linux-x64/"
          cp start-gameclock.sh "$PACKAGE/linux-arm64/"
          chmod +x "$PACKAGE"/linux-*/RedAnts.GameClock "$PACKAGE"/linux-*/start-gameclock.sh

      - name: Assemble packages
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PACKAGE="$RUNNER_TEMP/package"
          mkdir -p dist
          (cd "$PACKAGE/win-x64" && zip -qr "$GITHUB_WORKSPACE/RedAnts-GameClock/dist/gameclock-$VERSION-win-x64.zip" .)
          tar -czf "dist/gameclock-$VERSION-linux-x64.tar.gz" -C "$PACKAGE/linux-x64" .
          tar -czf "dist/gameclock-$VERSION-linux-arm64.tar.gz" -C "$PACKAGE/linux-arm64" .
          cp Start-GameClock.ps1 Start-GameClock.cmd start-gameclock.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: gameclock-${{ steps.version.outputs.version }}
          path: RedAnts-GameClock/dist/*

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: gameclock-v${{ steps.version.outputs.version }}
          name: RedAnts Matchuhr ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          generate_release_notes: true
          files: RedAnts-GameClock/dist/*
