<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchuhr</title>
<style>
  @font-face { font-family:'Teko'; font-weight:600; src:url(fonts/teko-600-latin.woff2) format('woff2'); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#000; color:#fff; overflow:hidden; cursor:none; }
  body { font-family:'Teko', 'Bahnschrift', 'Arial Narrow', sans-serif; font-weight:600; }

  .stage { container-type:inline-size; width:min(100vw, 177.78vh); aspect-ratio:16/9; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
           display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .time { font-size:30cqw; line-height:.8; font-variant-numeric:tabular-nums; }
  .row { display:flex; align-items:center; gap:3cqw; margin-top:2cqw; font-size:9cqw; font-variant-numeric:tabular-nums; }
  .row img { height:9cqw; width:9cqw; object-fit:contain; }
  .row .abbr { font-size:5cqw; color:#aaa; width:9cqw; text-align:center; }
  img.ra { filter:drop-shadow(0 0 .25cqw rgba(255,255,255,.55)); }
  .per { font-size:3.5cqw; color:#888; letter-spacing:.6cqw; margin-top:1cqw; min-height:4.5cqw; }
  .pause .time { color:#ffcf3f; }

  .status { position:fixed; right:12px; bottom:10px; font:13px system-ui, sans-serif; color:#555; display:flex; align-items:center; gap:6px; }
  .status i { width:8px; height:8px; border-radius:50%; background:#2a2; }
  .offline .status { color:#e44; font-size:16px; }
  .offline .status i { background:#e44; }
  .offline .stage { opacity:.35; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="time" id="time">--:--</div>
  <div class="row">
    <img class="ra" id="homeLogo" alt="">
    <span id="score">- : -</span>
    <img id="guestLogo" alt=""><span class="abbr" id="guestAbbr" hidden></span>
  </div>
  <div class="per" id="per"></div>
</div>
<div class="status"><i></i><span id="statusText">Verbinde …</span></div>

<script>
const $ = id => document.getElementById(id);
let teams = { home: {}, guests: {} };
let lastReceived = 0;

fetch('teams.json').then(r => r.json()).then(t => {
  teams = t;
  $('homeLogo').src = t.home.logo; $('homeLogo').alt = t.home.name;
}).catch(() => {});

function periodLabel(s) {
  const mode = (s.mode || '').toUpperCase();
  if (mode === 'INTERMISSION') return 'PAUSE';
  if (mode === 'TIME-OUT') return 'TIMEOUT';
  if (mode === 'GAME TIME' || mode === '') return s.period ? `${s.period}. DRITTEL` : '';
  return mode;
}

function render(s) {
  if (!s || !s.raw) return;
  lastReceived = Date.now();
  $('time').textContent = s.time || '--:--';
  $('score').textContent = `${s.homeScore} : ${s.guestScore}`;
  $('per').textContent = periodLabel(s);
  document.body.classList.toggle('pause', ['INTERMISSION', 'TIME-OUT'].includes((s.mode || '').toUpperCase()));

  const g = teams.guests?.[s.guest];
  if (g) {
    if (!$('guestLogo').src.endsWith(g.logo)) { $('guestLogo').src = g.logo; $('guestLogo').alt = g.name; }
    $('guestLogo').hidden = false; $('guestAbbr').hidden = true;
  } else {
    $('guestLogo').hidden = true; $('guestAbbr').hidden = false; $('guestAbbr').textContent = s.guest;
  }
}

function connect() {
  const es = new EventSource('events');
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();

setInterval(() => {
  const age = (Date.now() - lastReceived) / 1000;
  const offline = !lastReceived || age > 3;
  document.body.classList.toggle('offline', offline);
  $('statusText').textContent = !lastReceived ? 'Warte auf Matchuhr …'
    : offline ? `Keine Daten von der Matchuhr seit ${Math.round(age)} s` : 'live';
}, 500);
</script>
</body>
</html>
