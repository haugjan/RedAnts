           M62,40 H68 V68 H62 Z
           M76,40 H82 V68 H76 Z"/>
  <g fill="currentColor">
    <rect x="95" y="38" width="14" height="40" rx="7"/>
    <rect x="57" y="72" width="14" height="24" rx="6"/>
    <rect x="73" y="72" width="14" height="24" rx="6"/>
  </g>
</svg>
