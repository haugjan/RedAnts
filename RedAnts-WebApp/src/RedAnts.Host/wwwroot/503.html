<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>503 Spielunterbruch · Red Ants</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root { --red: #C8102E; --red-dark: #A50D26; --ink: #101010; --display: 'Oswald', Impact, sans-serif; }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { font-family: Verdana, Geneva, Tahoma, sans-serif; color: var(--ink); background: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
        .e503 { max-width: 720px; width: 100%; text-align: center; }
        .scene { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 auto 2.5rem; width: 100%; aspect-ratio: 30 / 13; border-bottom: 3px solid #eee; padding-bottom: 5px; position: relative; overflow: hidden; }
        .player { width: 24%; height: auto; z-index: 2; mix-blend-mode: multiply; }
        .mopper { width: 26%; height: auto; position: absolute; left: 37%; bottom: 5px; z-index: 1; animation: mop 2.5s infinite alternate ease-in-out; mix-blend-mode: multiply; }
        @keyframes mop { 0% { transform: translateX(-38%); } 100% { transform: translateX(38%); } }
        @media (prefers-reduced-motion: reduce) { .mopper { animation: none; } }
        .e503-title { font-family: var(--display); text-transform: uppercase; font-weight: 700; letter-spacing: 0.02em; color: var(--ink); font-size: clamp(2.2rem, 6vw, 3.5rem); line-height: 1; margin: 0; }
        .e503-title::after { content: ""; display: block; width: 64px; height: 5px; background: var(--red); margin: 1.2rem auto 0; }
        .e503-text { margin: 1.5rem auto 0; max-width: 540px; line-height: 1.7; font-size: 1.1rem; color: #444; }
        .e503-actions { display: flex; flex-wrap: wrap; gap: 0.85rem; justify-content: center; margin-top: 2.5rem; }
        .e503-btn { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; font-size: 1.05rem; text-decoration: none; padding: 0.8rem 1.8rem; transition: background 0.15s, color 0.15s, transform 0.1s; cursor: pointer; border: none; border-radius: 2px; }
        .e503-btn:active { transform: scale(0.98); }
        .e503-btn--primary { background: var(--red); color: #fff; }
        .e503-btn--primary:hover { background: var(--red-dark); color: #fff; }
    </style>
</head>
<body>
    <div class="e503">
        <div class="scene">
            <img class="player" src="/img/spielerin-links.jpg" alt="Spielerin wartet mit Stock" />
            <img class="mopper" src="/img/hallenwart-mopp.jpg" alt="Hallenwart wischt das Spielfeld" />
            <img class="player" src="/img/spielerin-rechts.jpg" alt="Spielerin wartet mit Stock" />
        </div>
        <h1 class="e503-title">503 Spielunterbruch</h1>
        <p class="e503-text">Das Spielfeld wird gerade gewischt. Wir führen notwendige Wartungsarbeiten am Server durch. Bitte habe einen Moment Geduld, wir sind gleich wieder bereit für den nächsten Einsatz.</p>
        <div class="e503-actions">
            <button class="e503-btn e503-btn--primary" onclick="window.location.reload()">Seite neu laden</button>
        </div>
    </div>
</body>
</html>
